<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Update Product to the Menu</title>
    <link rel="stylesheet" href="/css/update-product.css">
  </head>

  <body>
    <h1>Add A New Item to Menu</h1>
    <hr>
    <form action="#" th:action="@{/products/saveProduct}" th:object="${product}" method="post">
      <input type="hidden" th:field="*{id}" />
      <label for="name">Name: </label>
      <input type="text" id="name" name="name" th:field="*{name}">
      <br>
      <label for="price">Price:</label>
      <input type="text" id="price" name="price" th:field="*{price}">
      <br>
      <button type="submit">Save New Item</button>
    </form>
  </body>
</html>
