# Use root/example as user/password credentials

services:
  db:
    image: mariadb:10.7
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - 3307:3306
    volumes:
      - db-data:/var/lib/mysql   # volume persistant
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  db-data: