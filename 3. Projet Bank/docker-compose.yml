services:
  mysql:
    image: mysql:8.0
    container_name: supabank-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: BankManagementSystem

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/BankManagementSystem_Docker.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: supabank-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:mysql://mysql:3306/BankManagementSystem
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: supabank-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: supabank-cloudflared
    restart: unless-stopped

    command: tunnel --no-autoupdate run

    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}

    depends_on:
      - frontend

volumes:
  mysql_data:
